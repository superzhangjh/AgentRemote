org.gradle.jvmargs=-Xmx4G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Let android/app/build.gradle's ndk.abiFilters decide packaged ABIs.
# Without this the Flutter Gradle plugin resets abiFilters to every default
# platform, which re-adds armeabi-v7a/x86_64 for plugin-provided .so files.
disable-abi-filtering=true
